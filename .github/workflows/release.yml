name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean packaging/WeChat-TXT-PDF-Exporter.spec

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $exe = Join-Path $PWD "dist/WeChat-TXT-PDF-Exporter-v$version.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-offline', (Join-Path $PWD 'tmp/package-self-test')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build one-click installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc "/DAppVersion=$version" packaging/installer.iss

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") { throw "Release tag does not match package version: $tag" }
          $assets = @(
            "dist/WeChat-TXT-PDF-Exporter-Installer-v$version.exe",
            "dist/WeChat-TXT-PDF-Exporter-v$version.exe"
          )
          $checksumFile = "dist/SHA256SUMS-v$version.txt"
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $asset -Leaf)"
          }
          $checksums | Set-Content -LiteralPath $checksumFile -Encoding utf8
          $assets += $checksumFile
          $notesPattern = '(?ms)^# ' + [regex]::Escape($tag) + '\r?\n.*?(?=^# v|\z)'
          $notes = [regex]::Match((Get-Content RELEASE_NOTES.md -Raw), $notesPattern).Value.Trim()
          if (-not $notes) { throw "Release notes not found for $tag" }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          $notes | Set-Content -LiteralPath $notesFile -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            gh release edit $tag --title "微信聊天导出工具 v$version" --notes-file $notesFile --latest
          } else {
            gh release create $tag @assets --verify-tag --title "微信聊天导出工具 v$version" --notes-file $notesFile --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
