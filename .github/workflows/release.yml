name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Audit public source archive
        run: python scripts/verify_release_source.py --ref HEAD

      - name: Build application executable
        run: python -m PyInstaller --noconfirm --clean packaging/WeChat-Local-Exporter.spec

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $exe = Join-Path $PWD "dist/WeChat-Local-Exporter-v$version.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test-offline', (Join-Path $PWD 'tmp/package-self-test')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $receipt = Get-Content 'tmp/package-self-test/self-test-result.json' -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'ok') { throw 'Packaged self-test receipt is invalid' }

      - name: Verify frozen updater with synthetic executables
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          python scripts/verify_packaged_update.py "dist/WeChat-Local-Exporter-v$version.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_packaged_update.py "dist/WeChat-Local-Exporter-v$version.exe" --kind executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify Agent CLI download
        shell: pwsh
        run: ./scripts/build_cli.ps1 -Python (Get-Command python).Source -SkipTests

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build one-click installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc "/DAppVersion=$version" packaging/installer.iss

      - name: Verify one-click installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          $installer = (Resolve-Path "dist/WeChat-TXT-PDF-Exporter-Installer-v$version.exe").Path
          $builtExe = (Resolve-Path "dist/WeChat-Local-Exporter-v$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'wechat-exporter-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', '/NOICONS',
            "/DIR=$installDir"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer smoke test failed: $($process.ExitCode)" }
          $installedExe = Join-Path $installDir 'WeChat-TXT-PDF-Exporter.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) { throw 'Installed executable is missing' }
          $builtHash = (Get-FileHash -LiteralPath $builtExe -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installedExe -Algorithm SHA256).Hash
          if ($builtHash -ne $installedHash) { throw 'Installed executable hash does not match the build' }
          $selfTestDir = Join-Path $env:RUNNER_TEMP 'installed-self-test'
          $selfTest = Start-Process -FilePath $installedExe -ArgumentList @(
            '--self-test-offline', $selfTestDir
          ) -Wait -PassThru -WindowStyle Hidden
          if ($selfTest.ExitCode -ne 0) { throw "Installed self-test failed: $($selfTest.ExitCode)" }
          $receipt = Get-Content (Join-Path $selfTestDir 'self-test-result.json') -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'ok') { throw 'Installed self-test receipt is invalid' }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          $version = $tag.Substring(1)
          $packageVersion = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if ($version -ne $packageVersion) { throw "Release tag does not match package version: $tag" }
          $installer = "dist/WeChat-TXT-PDF-Exporter-Installer-v$version.exe"
          $installedExe = "dist/WeChat-Local-Exporter-v$version.exe"
          $installedHash = (Get-FileHash -LiteralPath $installedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize = (Get-Item -LiteralPath $installer).Length
          $cliZip = "dist/cli-assets/命令行_wechatexporterCLI_v$version.zip"
          if (-not (Test-Path -LiteralPath $cliZip)) { throw 'Verified CLI download asset is missing' }
          $releaseFiles = @($installer, $cliZip)
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @releaseFiles --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
            $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Existing release could not be read' }
            $existingBody = Join-Path $env:RUNNER_TEMP "existing-body-$tag.md"
            [System.IO.File]::WriteAllText($existingBody, $existing.body, [System.Text.UTF8Encoding]::new($false))
            python scripts/render_release_notes.py --tag $tag --output $notesFile --existing-body $existingBody --installed-exe-sha256 $installedHash
            if ($LASTEXITCODE -ne 0) { throw 'Edited release verification could not be refreshed' }
            gh release edit $tag --notes-file $notesFile --latest
          } else {
            python scripts/render_release_notes.py --tag $tag --output $notesFile --installed-exe-sha256 $installedHash --asset (Split-Path $installer -Leaf) --asset (Split-Path $cliZip -Leaf)
            if ($LASTEXITCODE -ne 0) { throw 'Release notes generation failed' }
            gh release create $tag @releaseFiles --verify-tag --title "$tag" --notes-file $notesFile --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published release could not be verified' }
          $assets = @($published.assets)
          $obsoleteNames = @(
            "WeChat-Local-Exporter-CLI-Windows-x64-v$version.zip",
            "WeChat-Local-Exporter-CLI-Windows-x64-v$version.zip.sha256",
            "WeChat-Local-Exporter-CLI-v$version.zip",
            "WeChat-Local-Exporter-CLI-v$version.zip.sha256",
            "命令行-WeChat-Local-Exporter-CLI-v$version.zip",
            "命令行-WeChat-Local-Exporter-CLI-v$version.zip.sha256",
            "WeChat-Local-Exporter-Update-v$version.exe"
          )
          foreach ($asset in $assets) {
            if ($asset.name -in $obsoleteNames -or $asset.name -like "WeChat-Local-Exporter-Delta-*-to-v$version-*.zip") {
              gh release delete-asset $tag $asset.name --yes
              if ($LASTEXITCODE -ne 0) { throw 'Obsolete release attachment could not be removed' }
            }
          }
          $publishedInstaller = @($assets | Where-Object { $_.name -eq (Split-Path $installer -Leaf) })
          # Keep the legacy download URL for v1.6.0's exact-name updater.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($publishedInstaller[0].id)" -f "label=wechatexporter_v$version.exe" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer label could not be updated' }
          foreach ($file in $releaseFiles) {
            $name = Split-Path $file -Leaf
            $matches = @($assets | Where-Object { $_.name -eq $name })
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($matches.Count -ne 1 -or $matches[0].size -ne (Get-Item -LiteralPath $file).Length -or $matches[0].digest -ne "sha256:$hash") {
              throw "Published update asset does not match the verified local file: $name"
            }
          }
