name: Sync release pages

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "RELEASE_NOTES.md"
      - "scripts/render_release_notes.py"
      - "scripts/sync_release_pages.py"
      - "tests/test_release_notes.py"
      - "tests/test_sync_release_pages.py"
      - ".github/workflows/sync-release-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Test release-page rendering
        run: python -m pytest tests/test_release_notes.py tests/test_sync_release_pages.py

      - name: Update existing release titles and descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_release_pages.py --repository "$GITHUB_REPOSITORY" --apply
