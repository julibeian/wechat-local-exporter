<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="assets/viewer.css">
  <script defer src="assets/viewer.js"></script>
  <script defer src="data/manifest.js"></script>
</head>
<body>
  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">资料与筛选</button>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <header class="archive-heading">
          <p class="eyebrow">微信聊天本地归档</p>
          <h1>{{CONVERSATION_NAME}}</h1>
          <p class="conversation-kind">{{CONVERSATION_KIND}}</p>
        </header>

        <dl class="archive-summary" aria-label="归档摘要">
          <div><dt>消息数</dt><dd id="summary-messages">—</dd></div>
          <div><dt>范围</dt><dd id="summary-range">—</dd></div>
          <div><dt>分块</dt><dd id="summary-chunks">—</dd></div>
          <div><dt>已加载分块</dt><dd id="summary-current-chunk">—</dd></div>
          <div><dt>媒体状态</dt><dd id="summary-media">—</dd></div>
          <div><dt>导出时间</dt><dd id="summary-generated">—</dd></div>
        </dl>

        <form class="filter-form" id="filter-form">
          <fieldset>
            <legend>搜索</legend>
            <label class="visually-hidden" for="search-input">搜索消息</label>
            <input id="search-input" name="query" type="search" autocomplete="off" placeholder="搜索消息、成员或文件名">
            <div class="button-row">
              <button class="button button-primary" id="search-button" type="submit">搜索全部记录</button>
              <button class="button" id="clear-button" type="button">清除</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>筛选</legend>
            <label for="member-filter">成员</label>
            <select id="member-filter" name="member">
              <option value="">全部成员</option>
            </select>
            <label for="type-filter">消息类型</label>
            <select id="type-filter" name="type">
              <option value="">全部类型</option>
            </select>
            <div class="date-fields">
              <label for="date-from">开始日期</label>
              <input id="date-from" name="dateFrom" type="date">
              <label for="date-to">结束日期</label>
              <input id="date-to" name="dateTo" type="date">
            </div>
          </fieldset>
        </form>

        <section class="search-panel" aria-labelledby="search-results-title">
          <div class="section-heading-row">
            <h2 id="search-results-title">搜索结果</h2>
            <span id="search-count">0</span>
          </div>
          <p class="search-help" id="search-help">输入关键词或选择筛选条件后搜索全部分块。</p>
          <ol class="search-results" id="search-results"></ol>
        </section>

        <footer class="archive-footer">
          <button class="text-button" id="theme-button" type="button">主题：自动</button>
          <p>完全离线查看 · 未加载远程内容</p>
        </footer>
      </div>
    </aside>

    <main class="conversation-pane" id="conversation-pane">
      <header class="conversation-toolbar">
        <div>
          <p class="toolbar-label">当前视图</p>
          <p class="toolbar-status" id="view-status" role="status" aria-live="polite">正在读取归档信息…</p>
        </div>
        <div class="toolbar-actions">
          <button class="button" id="previous-chunk" type="button">上一分块</button>
          <button class="button" id="next-chunk" type="button">下一分块</button>
        </div>
      </header>

      <section class="message-stage" aria-label="聊天消息">
        <button class="window-button" id="earlier-window" type="button">显示本块更早消息</button>
        <div class="message-list" id="message-list" tabindex="-1"></div>
        <button class="window-button" id="later-window" type="button">显示本块更新消息</button>
        <div class="empty-state" id="empty-state" hidden>
          <h2>当前范围没有消息</h2>
          <p>可以更换分块，或者清除搜索和筛选条件。</p>
        </div>
      </section>

      <nav class="chunk-navigation" aria-label="分块导航">
        <button class="button" id="first-chunk" type="button">最早分块</button>
        <label for="chunk-select">跳转分块</label>
        <select id="chunk-select"></select>
        <button class="button" id="latest-chunk" type="button">最新分块</button>
      </nav>
    </main>
  </div>

  <dialog class="media-dialog" id="media-dialog">
    <form method="dialog" class="dialog-bar">
      <p id="dialog-caption">查看图片</p>
      <button class="button" type="submit">关闭</button>
    </form>
    <img id="dialog-image" alt="">
  </dialog>

  <noscript>此离线归档需要启用 JavaScript，才能分块加载、搜索和筛选聊天记录。</noscript>
</body>
</html>
